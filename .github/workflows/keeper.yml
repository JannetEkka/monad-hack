# Seals SMT World's newest public snapshot on Monad testnet every hour, grades batches whose
# horizon has passed, and expires the ones nobody graded in time. The key lives only in the
# `monad-testnet` environment secret KEEPER_PRIVATE_KEY; without it the run is one dry run.
#
# GitHub's hourly cron is best-effort (on 10-12/13 it fired once in 8 hours), so one run
# keeps going: it works at :17 every hour for about 5.5 hours, then dispatches its own
# successor. GITHUB_TOKEN may trigger workflow_dispatch, and Actions minutes are free on a
# public repo. The cron below only restarts the chain if it ever breaks.
name: keeper
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every transaction but send none
        type: boolean
        default: false
permissions:
  contents: write # push the archived snapshots to the `archive` branch
  actions: write # dispatch the next run
concurrency:
  group: keeper
  cancel-in-progress: false
jobs:
  keep:
    runs-on: ubuntu-latest
    environment: monad-testnet
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx hardhat compile
      - name: Keeper (every hour at :17 for about 5.5 hours)
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          MONAD_RPC_URL: ${{ vars.MONAD_RPC_URL }}
          HORIZON_SECONDS: ${{ vars.HORIZON_SECONDS }}
          SEAL_EVERY_MIN: ${{ vars.SEAL_EVERY_MIN }}
          MIN_BALANCE_MON: ${{ vars.MIN_BALANCE_MON }}
          ARCHIVE_DIR: ${{ github.workspace }}/archive-out
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$KEEPER_PRIVATE_KEY" ] || [ "$DRY_RUN" = "true" ]; then
            [ -z "$KEEPER_PRIVATE_KEY" ] && echo "::warning::KEEPER_PRIVATE_KEY is not set in the monad-testnet environment: dry run, nothing sealed"
            node keeper/keeper.js --dry-run
            exit 0
          fi
          end=$(( $(date +%s) + 330 * 60 ))
          while :; do
            node keeper/keeper.js || echo "::warning::this keeper pass ended with an [ERROR]; see its lines above"
            bash scripts/archive.sh || echo "::warning::archive push failed; the next pass retries"
            next=$(( ( $(date +%s) / 3600 + 1 ) * 3600 + 17 * 60 ))
            [ "$next" -lt "$end" ] || break
            echo "next pass at $(date -u -d @$next +%H:%M) UTC"
            sleep $(( next - $(date +%s) ))
          done
          echo "HAND_OVER=1" >> "$GITHUB_ENV"
      - name: Hand over to the next run
        if: env.HAND_OVER == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keeper.yml --ref main --repo "$GITHUB_REPOSITORY"
