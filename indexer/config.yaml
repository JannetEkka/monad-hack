# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# SMT Receipts on Monad testnet. The address is the contract's CREATE2 address: it is fixed by
# the compiled code, so it is known before deployment (a test checks it matches the artifact).
name: smt-receipts
description: SMT Receipts - a trading agent's calls sealed on Monad and graded by RedStone-signed prices
disable_default_cross_chain: true
# every handler records the transaction it came from, so the page can link it
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: SMTReceipts
    events:
      - event: AgentRegistered(uint256 indexed agentId, address indexed publisher, string name, string source, uint16 feeBps, bytes32[] feeds)
      - event: Sealed(uint256 indexed batchId, uint256 indexed agentId, uint64 sourceTs, bytes32 snapshotHash, uint64 entryTs, uint64 exitTs, uint256 calls, bytes32[] reasonHashes, string[] whys)
      - event: Graded(uint256 indexed batchId, uint256 indexed agentId, uint8[] feedIndex, uint256[] entryPrice, uint256[] exitPrice, int32[] movePpm, int32[] netPpm, uint8 hits)
      - event: Expired(uint256 indexed batchId, uint256 indexed agentId, uint8 missed)
chains:
  - id: 10143
    # the contract's deploy block (the first block with code at its CREATE2 address)
    start_block: 70662788
    # Three RPC sources, tried in this order. Envio Cloud's default source for this chain never
    # returned a block height (10-14), and a deployment pointed only at Monad's public RPC got
    # no height either, so the primary is Envio's own HyperRPC (the project's ENVIO_API_TOKEN as
    # a bearer header) and two public RPCs are the fallbacks. Both public ones answer eth_getLogs
    # for 100 blocks (Monad's refuses 500 with 413), so they stay at 100.
    rpc:
      - url: https://10143.rpc.hypersync.xyz
        for: sync
        headers:
          Authorization: "Bearer ${ENVIO_API_TOKEN}"
        initial_block_interval: 100
        interval_ceiling: 1000
        acceleration_additive: 100
      - url: https://rpc.ankr.com/monad_testnet
        for: fallback
        initial_block_interval: 100
        interval_ceiling: 100
        acceleration_additive: 0
      - url: https://testnet-rpc.monad.xyz
        for: fallback
        initial_block_interval: 100
        interval_ceiling: 100
        acceleration_additive: 0
    contracts:
      - name: SMTReceipts
        address:
          - "0xDF9f42AE4f81F086F8495c5a5339dDaa90057993"
